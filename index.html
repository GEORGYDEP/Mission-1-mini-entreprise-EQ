<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 1 – Fonde ton entreprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<link id="polices-decor" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220; --panel:#121B2C; --panel2:#182438; --panel3:#213150;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --text:#EEF2F8; --muted:#A3AFC4; --dim:#71809A;
  --gold:#E3B85C; --gold2:#F6D88F; --steel:#7CB0FF; --mint:#4FD69C; --coral:#FF6F6F; --amber:#FFB454;
  --paper:#F6F1E7; --paper2:#EDE5D4; --paper-ink:#1B2233; --paper-muted:#5B6478; --paper-line:#D6CDBB;
  --brand:#2F6FED; --on-brand:#ffffff;
  --r:14px; --r-lg:22px;
  --display:'Bricolage Grotesque','Segoe UI',Arial,sans-serif; --ui:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--ink);color:var(--text);min-height:100vh;font-size:16.5px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
[hidden]{display:none!important}
b,strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;font-weight:700;letter-spacing:-.01em}

/* ═══ Fond : quadrillage de livre de comptes + halo de la couleur de l'entreprise ═══ */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.grid-bg::after{content:'';position:absolute;inset:-20% -10% auto;height:70vh;
  background:radial-gradient(60% 60% at 30% 0%,color-mix(in srgb,var(--brand) 28%,transparent),transparent 70%),radial-gradient(40% 50% at 85% 10%,rgba(227,184,92,.14),transparent 70%);transition:background 1s}

/* ═══ Barre du haut : identité + indicateurs vivants ═══ */
.top{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:18px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);transition:background .5s}
.mark.emo{font-size:24px}
.top h1{font-size:19px;font-weight:700}
.top h1 small{display:block;font-family:var(--ui);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.kpis{margin-left:auto;display:flex;gap:8px}
.kpi{padding:7px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);min-width:118px}
.kpi span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.kpi b{display:block;font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap}
.kpi.ok b{color:var(--mint)} .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--coral)}
.who{text-align:right;font-size:13px;color:var(--muted);line-height:1.25;padding-left:10px;border-left:1px solid var(--line)}
.who b{display:block;color:var(--text);font-size:14px}
.who button{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.xp{font-family:var(--mono);font-size:13px;color:var(--gold2);padding:6px 12px;border-radius:999px;border:1px solid rgba(227,184,92,.35);background:rgba(227,184,92,.08);white-space:nowrap}
.xp small{color:var(--muted);font-family:var(--ui)}

/* ═══ Mise en page : rail des étapes | contenu | tableau de bord ═══ */
.layout{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:24px 22px 80px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr);max-width:1080px}
.layout aside{align-self:stretch}
.rail{display:none}
main{min-width:0}
.rail{position:sticky;top:84px}
.rail ol{list-style:none}
.rail li{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;color:var(--dim);font-size:14px;position:relative}
.rail li .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none;background:var(--panel)}
.rail li.done{color:var(--muted)} .rail li.done .n{background:var(--mint);border-color:var(--mint);color:#07261a}
.rail li.now{color:var(--text);background:rgba(255,255,255,.05);font-weight:600} .rail li.now .n{background:var(--gold);border-color:var(--gold);color:#2b1d02}
.rail li:not(:last-child)::after{content:'';position:absolute;left:22px;top:38px;width:1.5px;height:12px;background:var(--line2)}
.rail .mini{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.5}

/* ═══ Barre des étapes (horizontale, comme à l'origine) ═══ */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stp{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;color:var(--dim);white-space:nowrap}
.stp .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.stp.done{color:var(--muted)} .stp.done .n{background:var(--mint);border-color:var(--mint);color:#07261a}
.stp.now{color:var(--text);border-color:rgba(255,61,139,.6);background:rgba(255,61,139,.12);font-weight:600} .stp.now .n{background:var(--grad,var(--gold));border-color:transparent;color:#fff}
.steps-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 22px} .steps-bar i{display:block;height:100%;background:var(--grad,var(--gold));transition:width .5s}

/* ═══ Blocs ═══ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.card.tight{padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.kick{font-size:13px;color:var(--muted);margin-bottom:8px}
.kick b{color:var(--gold);font-family:var(--mono);font-weight:500}
.title{font-size:clamp(28px,3.6vw,40px);margin-bottom:10px;max-width:22ch}
.lead{color:var(--muted);max-width:66ch;margin-bottom:22px;font-size:16.5px}
.sub{font-family:var(--display);font-size:17px;font-weight:600;margin:22px 0 10px;color:var(--text)}
.help{font-size:13.5px;color:var(--muted);margin-top:8px}
.err{font-size:14px;color:var(--coral);margin-top:8px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:rgba(124,176,255,.08);border:1px solid rgba(124,176,255,.25);font-size:15px;margin:14px 0}
.note.gold{background:rgba(227,184,92,.08);border-color:rgba(227,184,92,.3)}
.note.warn{background:rgba(255,180,84,.09);border-color:rgba(255,180,84,.35)}
.note.bad{background:rgba(255,111,111,.08);border-color:rgba(255,111,111,.35)}
.note.ok{background:rgba(79,214,156,.08);border-color:rgba(79,214,156,.3)}
.note .i{font-size:22px;line-height:1;flex:none}
.coach{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(227,184,92,.1),rgba(124,176,255,.07));border:1px solid rgba(227,184,92,.25);margin-bottom:22px}
.coach .av{width:46px;height:46px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-size:24px;flex:none;border:1px solid var(--line2)}
.coach p{font-size:15.5px;color:var(--text)} .coach p b{color:var(--gold2)}
.coach small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))} .row3{grid-template-columns:2fr 1fr 1fr}

/* choix (cartes cliquables) */
.choice{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;position:relative;display:block;width:100%}
.choice:hover{border-color:var(--line2);background:var(--panel3)}
.choice.on{border-color:var(--gold);background:rgba(227,184,92,.09);box-shadow:0 0 0 3px rgba(227,184,92,.15)}
.choice.on::before{content:'✓';position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2b1d02;display:grid;place-items:center;font-size:13px;font-weight:700}
.choice.full{opacity:.45;cursor:not-allowed}
.choice .ico{font-size:30px;line-height:1;margin-bottom:8px}
.choice h4{font-size:17px;margin-bottom:4px}
.choice p{font-size:14px;color:var(--muted)}
.choice .meta{margin-top:10px;font-size:13px;color:var(--muted);display:grid;gap:3px} .choice .meta b{color:var(--text)}
.choice .tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);margin:8px 6px 0 0}
.choice .tag.full{color:var(--coral);border-color:rgba(255,111,111,.5)}
.choice .pro,.choice .con{display:block;font-size:13.5px;margin-top:5px;padding-left:18px;position:relative}
.choice .pro::before{content:'+';position:absolute;left:0;color:var(--mint);font-weight:700} .choice .con::before{content:'−';position:absolute;left:0;color:var(--coral);font-weight:700}
.choice .cost{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--gold2);padding:4px 10px;border-radius:8px;background:rgba(227,184,92,.1)}
.sec-primaire .ico{filter:drop-shadow(0 0 10px rgba(79,214,156,.5))} .sec-secondaire .ico{filter:drop-shadow(0 0 10px rgba(124,176,255,.5))} .sec-tertiaire .ico{filter:drop-shadow(0 0 10px rgba(227,184,92,.5))}
.sector-h{display:flex;align-items:center;gap:14px;margin:22px 0 10px} .sector-h .rule{flex:1;height:1px;background:var(--line)} .sector-h span{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--muted);transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--text)} .chip.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.inp{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text);font-size:16px}
.inp:focus{border-color:var(--steel);outline:none;background:rgba(124,176,255,.05)}
select.inp{background:#1b1233} select.inp option{background:#1b1233;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)} .btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-main{background:var(--gold);color:#2b1d02;box-shadow:0 8px 26px rgba(227,184,92,.25)} .btn-main:not([disabled]):hover{background:var(--gold2)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--text)} .btn-ghost:hover{background:rgba(255,255,255,.05)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-steel{background:var(--steel);color:#071a3a}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.hint{font-size:13.5px;color:var(--amber)}
.spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.btn-ghost .spin{border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:50px;height:50px;border-radius:14px;border:3px solid transparent;cursor:pointer;position:relative;transition:transform .12s}
.sw.small{width:40px;height:40px;border-radius:11px}
.sw:hover{transform:scale(1.08)} .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 0 0 5px #fff}
.sw span{position:absolute;left:50%;top:110%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.sym{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line2);background:var(--panel2);font-size:26px;cursor:pointer;display:grid;place-items:center}
.sym.on{border-color:var(--gold);background:rgba(227,184,92,.12)}
.stylebtn{font-size:26px;padding:16px 18px;line-height:1.1} .stylebtn small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:400;font-style:normal;letter-spacing:0}
.f-moderne{font-family:Outfit,Arial,sans-serif;font-weight:700} .f-elegant{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700} .f-fun{font-family:Fredoka,'Comic Sans MS',sans-serif;font-weight:600} .f-street{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.04em;font-size:1.25em}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.opt{border:1.5px solid var(--line2);background:var(--panel2);border-radius:11px;padding:9px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
.opt.on{border-color:var(--gold);background:rgba(227,184,92,.12)} .opt .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.opt small{color:var(--muted);font-size:12.5px}

/* ═══ Tableaux chiffrés ═══ */
table.led{width:100%;border-collapse:collapse;font-size:14.5px}
table.led th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.led td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.led td.n,table.led th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.led tr.tot td{font-weight:700;border-top:2px solid var(--line2);border-bottom:0;background:rgba(255,255,255,.03)}
table.led tr.on td{background:rgba(227,184,92,.1)}
table.led td.neg,.neg{color:var(--coral)} .pos{color:var(--mint)}
.money{font-family:var(--mono)}

/* bilan en deux colonnes */
.bilan{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.bilan .col{padding:0} .bilan .col+.col{border-left:1px solid var(--line2)}
.bilan h5{font-family:var(--display);font-size:14px;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.bilan h5 small{font-family:var(--ui);font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.bilan .l{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:14px;border-bottom:1px dashed var(--line)}
.bilan .l .k{color:var(--muted)} .bilan .l .k b{color:var(--text);display:block;font-weight:500}
.bilan .l .v{font-family:var(--mono);white-space:nowrap}
.bilan .l.vide{color:var(--dim);font-style:italic}
.bilan .sect{font-size:11.5px;color:var(--dim);padding:8px 14px 2px;font-weight:600}
.bilan .t{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-family:var(--mono);background:rgba(227,184,92,.1);border-top:1px solid var(--line2)}
.bilan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.bilan-foot b{color:var(--mint)}

/* jauge d'autonomie */
.gauge{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin:8px 0 4px}
.gauge i{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--amber) 35%,var(--mint) 70%);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.big-n{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1}
.big-n small{font-family:var(--ui);font-size:14px;color:var(--muted);font-weight:400}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.stat3.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat3 .s{padding:14px 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}
.stat3 .s span{display:block;font-size:12.5px;color:var(--muted)} .stat3 .s b{display:block;font-family:var(--mono);font-size:20px;margin-top:4px}

/* barres d'étude de marché */
.bars{display:grid;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;font-size:14px}
.bar .track{height:14px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden} .bar .fill{display:block;height:100%;border-radius:999px;background:var(--steel);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .v{font-family:var(--mono);text-align:right}

/* ═══ Documents « papier » ═══ */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.06);position:relative;overflow:hidden;font-size:14.5px}
.paper::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");opacity:.08;mix-blend-mode:multiply;pointer-events:none}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:14px}
.paper .ph h4{font-size:17px;font-weight:800;letter-spacing:0} .paper .ph small{display:block;color:var(--paper-muted);font-size:12px;font-weight:400}
.paper .ph .ref{font-family:var(--mono);font-size:11.5px;color:var(--paper-muted);text-align:right}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.paper dt{color:var(--paper-muted)} .paper dd{font-weight:500} .paper dd .num{font-family:var(--mono);background:#fff;padding:2px 8px;border-radius:5px;border:1px solid var(--paper-line);letter-spacing:.04em}
.paper .foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--paper-muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seal{width:84px;height:84px;border-radius:50%;border:3px double var(--brand);display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;color:var(--brand);transform:rotate(-12deg);line-height:1.15;padding:8px;background:rgba(255,255,255,.5);flex:none}
.seal b{display:block;font-size:20px;line-height:1}
.stamp{display:inline-block;padding:6px 12px;border:3px solid var(--mint);color:#0d7a4b;border-radius:6px;font-weight:800;letter-spacing:.08em;transform:rotate(-6deg);font-size:14px;background:rgba(255,255,255,.6)}
.paper table.led th{color:var(--paper-muted);border-bottom-color:var(--paper-ink)} .paper table.led td{border-bottom-color:var(--paper-line)}
.paper table.led tr.tot td{border-top-color:var(--paper-ink);background:rgba(0,0,0,.04)}
.paper .bilan{background:#fff;border-color:var(--paper-line)} .paper .bilan h5{background:var(--paper2);border-color:var(--paper-line)} .paper .bilan .col+.col{border-color:var(--paper-line)}
.paper .bilan .l{border-color:var(--paper-line)} .paper .bilan .l .k{color:var(--paper-muted)} .paper .bilan .l .k b{color:var(--paper-ink)} .paper .bilan .t{background:var(--paper2);border-color:var(--paper-line)} .paper .bilan .sect{color:var(--paper-muted)}
.sigline{margin-top:16px;display:flex;justify-content:flex-end}
.sigline div{min-width:260px;border-top:1px solid var(--paper-ink);padding-top:6px;font-size:12px;color:var(--paper-muted)}
.sigline input{width:100%;border:0;border-bottom:1px dashed var(--paper-line);background:transparent;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;color:var(--brand);padding:4px 0;outline:none}
.engage{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:rgba(255,255,255,.04);border:1px solid var(--line2);margin-top:18px;cursor:pointer;font-size:15px}
.engage input{width:20px;height:20px;accent-color:var(--gold);margin-top:3px}
.chk{list-style:none;margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chk li::before{content:'○ ';color:var(--dim)} .chk li.ok{color:var(--mint)} .chk li.ok::before{content:'● '}

/* carte bancaire */
.bankcard{aspect-ratio:1.586;border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 85%,#000) 0%,var(--brand) 55%,color-mix(in srgb,var(--brand) 60%,#fff) 140%);box-shadow:0 22px 50px rgba(0,0,0,.5);max-width:420px;font-family:var(--mono)}
.bankcard::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%)}
.bankcard .bank{position:absolute;top:18px;right:22px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;opacity:.95}
.bankcard .chipc{width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f3d58a,#c79a3c);position:relative;margin-top:6px}
.bankcard .chipc::after{content:'';position:absolute;inset:7px 6px;border:1px solid rgba(0,0,0,.25);border-radius:4px}
.bankcard .iban{font-size:17px;letter-spacing:.08em;margin-top:30px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bankcard .holder{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.bankcard .holder b{display:block;font-size:14px;font-weight:600;letter-spacing:.04em}
.bankcard .holder small{display:block;font-size:9.5px;opacity:.8;letter-spacing:.1em}
.bankcard.dim{filter:grayscale(.6);opacity:.55}

/* vitrine, logo, carte de visite */
.front-wrap{border-radius:var(--r-lg);overflow:hidden;background:#0E1A2E;border:1px solid var(--line)}
.front{display:block;width:100%;height:auto}
.logo-prev{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);margin-bottom:18px}
.logo-mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:none;border:4px solid rgba(255,255,255,.08)}
.logo-name{font-size:28px;line-height:1.1}
.logo-slogan{font-size:14px;color:var(--muted);margin-top:4px;font-family:var(--ui);font-style:normal;letter-spacing:0;font-weight:400}
.biz{background:#fff;color:var(--paper-ink);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.4);aspect-ratio:1.75;max-width:360px;font-size:12px;position:relative;overflow:hidden}
.biz::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--brand)}
.biz .bn{font-size:17px;line-height:1.1} .biz .bs{color:var(--paper-muted);font-style:italic;margin-bottom:8px}
.biz .who2{font-weight:700;font-size:13px;margin-top:4px}
.boutique-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.duo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:22px}

/* ═══ Tableau de bord (colonne droite) ═══ */
.dash{position:sticky;top:76px;display:grid;gap:12px;max-height:calc(100vh - 90px);overflow:auto;padding-right:2px}
.dash .front-wrap{border-radius:var(--r)}
.dash .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.dash .m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .dash .m3 div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:11.5px;color:var(--muted)} .dash .m3 b{display:block;font-family:var(--mono);font-size:14px;color:var(--text);margin-top:2px}
.dash h3{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dash h3 b{color:var(--text)}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.srow .k{color:var(--muted)} .srow .v{text-align:right;font-weight:500} .srow .v.todo{color:var(--dim);font-style:italic;font-weight:400}
.pbar{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint));transition:width .6s}
.dash .bilan .l{padding:6px 12px;font-size:12.5px} .dash .bilan h5{padding:8px 12px;font-size:12.5px} .dash .bilan .t{padding:8px 12px;font-size:13px}
.lvl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)} .lvl b{font-family:var(--display);color:var(--gold2);font-size:15px}

/* ═══ Écrans d'accueil / briefing / fin ═══ */
.hero{text-align:left;padding:30px 0 10px;max-width:980px}
.hero h2{font-size:clamp(38px,6vw,66px);line-height:.98;letter-spacing:-.025em;margin:16px 0 18px;max-width:14ch}
.hero .lead{font-size:18px;max-width:58ch}
.school{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--muted)}
.school .mark{width:30px;height:30px;border-radius:8px;font-size:12px;box-shadow:none}
.login{max-width:520px;margin-top:28px}
.road{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.road li{padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--muted);display:grid;gap:4px}
.road li .n{font-family:var(--mono);font-size:12px;color:var(--dim)} .road li b{color:var(--text);font-family:var(--display);font-size:15px}
.road li.now{border-color:var(--gold);background:rgba(227,184,92,.08)} .road li.now .n{color:var(--gold)}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.goal{padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)} .goal .gi{font-size:28px;margin-bottom:6px} .goal b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px} .goal p{font-size:14px;color:var(--muted)}
.today{display:flex;flex-wrap:wrap;gap:8px}
.today span{font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-align:center} .stat b{display:block;font-family:var(--mono);font-size:26px} .stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.badge{padding:12px 8px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);text-align:center;font-size:12.5px} .badge .i{font-size:28px;margin-bottom:4px} .badge.lockd{opacity:.35} .badge b{display:block;font-weight:500}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.word{padding:12px 14px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);font-size:13.5px} .word b{display:block;color:var(--gold2);font-family:var(--display);font-size:15px;margin-bottom:3px} .word span{color:var(--muted)}
.status{padding:12px 16px;border-radius:var(--r);font-size:14.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.status.ok{background:rgba(79,214,156,.1);border:1px solid rgba(79,214,156,.35)} .status.err{background:rgba(255,111,111,.1);border:1px solid rgba(255,111,111,.35)} .status.wait{background:rgba(124,176,255,.08);border:1px solid rgba(124,176,255,.3)}
.next{display:flex;gap:16px;align-items:center;padding:18px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line);margin-top:20px} .next .ic{font-size:34px}

/* défi éclair */
.quiz{border:1.5px solid rgba(124,176,255,.35);border-radius:var(--r-lg);padding:18px 20px;background:rgba(124,176,255,.06);margin-top:18px}
.quiz h4{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px} .quiz h4 .pts{font-family:var(--mono);font-size:12px;color:var(--gold2);border:1px solid rgba(227,184,92,.4);padding:2px 8px;border-radius:999px}
.quiz p{font-size:15px;margin-bottom:10px}
.quiz .q{display:grid;gap:8px} .quiz .q button{text-align:left;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14.5px}
.quiz .q button.ok{border-color:var(--mint);background:rgba(79,214,156,.15)} .quiz .q button.ko{border-color:var(--coral);background:rgba(255,111,111,.12)} .quiz .q button[disabled]{cursor:default}
.quiz .exp{margin-top:10px;font-size:14px;color:var(--muted)}
.bonus{border:1.5px dashed rgba(227,184,92,.5);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:rgba(227,184,92,.05)}
.bonus h4{font-size:16px;color:var(--gold2)} .bonus p{font-size:14.5px;color:var(--muted);margin:6px 0 10px} .bonus.won{border-style:solid;border-color:var(--mint)} .bonus.won h4{color:var(--mint)}

/* banque : décision */
.bank{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line);margin-top:12px}
.bank .dec{font-family:var(--display);font-weight:700;font-size:15px;padding:8px 14px;border-radius:10px}
.bank .dec.ok{background:rgba(79,214,156,.15);color:var(--mint)} .bank .dec.ko{background:rgba(255,111,111,.15);color:var(--coral)}
.money-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.money-opts .choice{padding:12px 14px;text-align:center} .money-opts .choice::before{display:none} .money-opts .choice b{font-family:var(--mono);font-size:19px;display:block} .money-opts .choice small{font-size:12px;color:var(--muted)}

/* toasts, modal, confettis, print */
#toasts{position:fixed;right:18px;bottom:18px;z-index:60;display:grid;gap:8px}
.toast{background:#1c1236;border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:12px 16px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .35s cubic-bezier(.2,.8,.2,1);max-width:340px}
.toast b{color:var(--gold2);font-family:var(--mono)} .toast .wd{color:var(--muted);font-size:13px;margin-top:4px}
.toast.word{border-color:rgba(124,176,255,.5)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,9,18,.75);display:grid;place-items:center;padding:20px}
.modal .box{background:#160f2c;border:1px solid var(--line2);border-radius:var(--r-lg);padding:24px;max-width:860px;width:100%;max-height:90vh;overflow:auto}
.modal pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--muted);margin:14px 0}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.reveal{animation:rev .7s cubic-bezier(.2,.8,.2,1) both}
.reveal.d1{animation-delay:.35s} .reveal.d2{animation-delay:.8s} .reveal.d3{animation-delay:1.25s}
@keyframes rev{from{opacity:0;transform:translateY(26px) scale(.97)}}
#print-area{display:none}
@media print{body>*{display:none!important} body{background:#fff;color:#000} #print-area{display:block!important;color:#000} #print-area .paper{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin-bottom:8mm;background:#fff} .bankcard{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact} .paper .bilan{border:1px solid #ccc}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1240px){.kpi{min-width:0}}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);padding:18px 14px 60px} .layout aside{position:static} .dash{position:static;max-height:none} .stp .lab{display:none} .stp.now .lab{display:inline}
  .kpis{display:none} .who{display:none} .g2,.g3,.g4,.row,.row3,.boutique-grid,.duo,.goals,.words,.bilan{grid-template-columns:minmax(0,1fr)} .bilan .col+.col{border-left:0;border-top:1px solid var(--line2)} .stats,.stat3,.stat3.five{grid-template-columns:repeat(2,minmax(0,1fr))} .dash{grid-template-columns:minmax(0,1fr)} .bar{grid-template-columns:110px 1fr 50px} .title{font-size:28px}}

/* ═══ Thème festif : l'ambiance d'origine (fond violet profond, halos colorés, verre dépoli) ═══ */
:root{ --ink:#0a0618; --bg-deep:#0a0618; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.085); --panel3:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.24); --text:rgba(255,255,255,.93); --muted:rgba(255,255,255,.72); --dim:rgba(255,255,255,.5);
  --gold:#fbbf24; --gold2:#fde68a; --steel:#38bdf8; --mint:#34d399; --coral:#fb7185; --amber:#fb923c; --violet:#9d4edd;
  --pink:#ff3d8b; --magenta:#e935c5; --indigo:#6366f1; --cyan:#22d3ee;
  --grad:linear-gradient(120deg,var(--pink),var(--magenta) 35%,var(--violet) 70%,var(--indigo)) }
body{background:var(--bg-deep)}
.grid-bg{display:none}
.mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.b1{width:520px;height:520px;background:var(--pink);top:-80px;left:-120px;animation:d1 22s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--violet);top:10%;right:-100px;animation:d2 26s ease-in-out infinite}
.b3{width:540px;height:540px;background:var(--cyan);top:40%;left:20%;opacity:.3;animation:d3 30s ease-in-out infinite}
.b4{width:420px;height:420px;background:var(--orange,#fb923c);bottom:5%;right:15%;opacity:.33;animation:d4 24s ease-in-out infinite}
.b5{width:380px;height:380px;background:var(--magenta);bottom:-120px;left:30%;animation:d5 28s ease-in-out infinite}
@keyframes d1{50%{transform:translate(80px,120px) scale(1.15)}} @keyframes d2{50%{transform:translate(-100px,150px) scale(1.1)}}
@keyframes d3{50%{transform:translate(120px,-80px) scale(1.2)}} @keyframes d4{50%{transform:translate(-90px,-120px) scale(1.1)}}
@keyframes d5{50%{transform:translate(110px,-60px) scale(1.15)}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E")}
.banner{position:relative;z-index:10;color:#fff;text-align:center;padding:9px 20px;font-size:14px;font-weight:600;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--pink),var(--magenta) 25%,var(--violet) 50%,var(--indigo) 75%,var(--cyan));background-size:200% 100%;animation:bshift 10s linear infinite;box-shadow:0 4px 30px rgba(233,53,197,.3)}
.pulse{display:inline-block;width:8px;height:8px;background:#fff;border-radius:50%;margin-right:10px;vertical-align:middle;animation:pd 1.3s ease-in-out infinite}
@keyframes pd{50%{transform:scale(1.2);box-shadow:0 0 0 10px rgba(255,255,255,0)}} @keyframes bshift{to{background-position:200% 0}}
.top{background:rgba(10,6,24,.72)}
.card,.panel,.choice,.dash .box,.coach,.quiz,.bonus,.bank,.goal,.road li,.stat,.stat3 .s,.badge,.word,.next,.kpi,.src,.tile,.gate,.hl,.kpi-row .k{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.btn-main{background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(233,53,197,.35);border:0} .btn-main:not([disabled]):hover{background:var(--grad);filter:brightness(1.12)}
.btn-ghost.on{border-color:var(--mint);color:var(--mint)}
.choice.on{border-color:var(--pink);background:rgba(255,61,139,.12);box-shadow:0 0 0 3px rgba(255,61,139,.22),0 12px 30px rgba(233,53,197,.18)} .choice.on::before{background:var(--pink);color:#fff}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.opt.on,.sym.on{border-color:var(--pink);background:rgba(255,61,139,.14)}
.rail li.now{background:rgba(255,255,255,.08)} .rail li.now .n{background:var(--grad);border-color:transparent;color:#fff}
.kick b{color:var(--pink)}
.coach{background:linear-gradient(135deg,rgba(255,61,139,.13),rgba(34,211,238,.08));border-color:rgba(255,61,139,.32)} .coach p b{color:#ffd1e3} .coach .av{background:linear-gradient(135deg,var(--pink),var(--violet));border:0}
.quiz{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.07)} .quiz h4 .pts{color:var(--gold2)}
.bonus{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.07)}
.note{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3)} .note.gold{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35)}
.mark{box-shadow:0 0 22px color-mix(in srgb,var(--brand) 60%,transparent)}
.xp{color:transparent;background:var(--grad) border-box;-webkit-background-clip:text;background-clip:text;border:1px solid rgba(255,255,255,.2);-webkit-text-fill-color:transparent}
.xp small{-webkit-text-fill-color:rgba(255,255,255,.6)}
.kpi{border-top-color:var(--c,var(--pink))}
.bilan .t{background:rgba(255,61,139,.14)} table.led tr.on td{background:rgba(255,61,139,.12)}
.pbar i{background:var(--grad)} .prog i{background:var(--grad)}
.ask{background:linear-gradient(135deg,rgba(255,61,139,.13),rgba(34,211,238,.08));border-color:rgba(255,61,139,.32)} .ask b{color:#ffd1e3}
.nv.on{background:rgba(255,61,139,.16)} .brand .lg{background:var(--grad);color:#fff}
.seal{border-color:var(--brand)}

body[data-m1="login"] .road li{position:relative; margin-top:12px; padding:14px 16px 16px; border:0; border-radius:3px 8px 6px 6px; color:#2b2318;
  background-color:#d8c69e; background-image:linear-gradient(180deg, rgba(255,255,255,.26), rgba(0,0,0,.05) 70%), repeating-linear-gradient(90deg, rgba(120,80,20,.05) 0 2px, transparent 2px 7px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 14px 26px rgba(0,0,0,.42); -webkit-backdrop-filter:none; backdrop-filter:none}
body[data-m1="login"] .road li::before{content:""; position:absolute; left:12px; top:-12px; width:44%; height:13px; border-radius:7px 7px 0 0; background-color:inherit;
  background-image:linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.08))}
body[data-m1="login"] .road li .n{color:#5a4320}
body[data-m1="login"] .road li b{color:#1d1810}
body[data-m1="login"] .road li > span:last-child{color:#4a3b22}
body[data-m1="login"] .road li.now{background-color:#f3dca2; box-shadow:0 0 0 3px #ff3d8b, 0 0 26px rgba(255,61,139,.45), 0 14px 26px rgba(0,0,0,.42)}
body[data-m1="login"] .road li.now .n{color:#8a1f4a}

/* ─── 2. Briefing : le cabinet de Nadia ; les quatre objectifs, des chemises posées sur le bureau ─── */
@media (min-width:901px){
  body[data-m1="briefing"] .hero{display:grid; grid-template-columns:minmax(0,1fr) 300px; column-gap:34px; align-items:start; max-width:1000px}
  body[data-m1="briefing"] .hero > *{grid-column:1 / -1}
  body[data-m1="briefing"] .hero > .kick, body[data-m1="briefing"] .hero > h2, body[data-m1="briefing"] .hero > .lead{grid-column:1}
  body[data-m1="briefing"] .hero > .m1-cabinet{grid-column:2; grid-row:1 / span 3}
}
.m1-cabinet{position:relative; height:300px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,.14); box-shadow:0 26px 60px rgba(0,0,0,.5); background:linear-gradient(180deg,#252c56,#1a1f40 75%)}
.m1-cab-mur{position:absolute; inset:0 0 72px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px), radial-gradient(60% 55% at 50% 55%, rgba(255,214,140,.22), transparent 70%)}
.m1-cab-etagere{position:absolute; left:14px; top:14px; width:178px}
.m1-cab-etagere .cpt-etagere{max-width:none; filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.m1-cab-cadre{position:absolute; right:18px; top:24px; width:82px; padding:9px 6px 8px; text-align:center; background:#fffdf6; border:5px solid #a77f2e; box-shadow:0 6px 12px rgba(0,0,0,.45); transform:rotate(1.5deg);
  font:600 8px/1.25 var(--doc); color:#4a5068}
.m1-cab-cadre b{display:block; margin-bottom:3px; font:800 10px/1.1 var(--doc); letter-spacing:.06em; text-transform:uppercase; color:#14284b}
.m1-cab-cadre i{display:block; width:18px; height:18px; margin:5px auto 0; border-radius:50%; background:radial-gradient(circle at 35% 35%, #f6d88f, #a77f2e)}
.m1-cab-nadia{position:absolute; left:50%; bottom:58px; width:126px; height:126px; margin-left:-63px}
.m1-cab-nadia svg{display:block; width:100%; height:100%}
.m1-cab-bureau{position:absolute; left:0; right:0; bottom:0; height:76px; background:linear-gradient(180deg,#9a663a 0 7px,#6d4426 7px,#573620); box-shadow:inset 0 2px 0 rgba(255,255,255,.2), 0 -6px 16px rgba(0,0,0,.35)}
.m1-cab-chevalet{position:absolute; left:50%; bottom:15px; transform:translateX(-50%); padding:6px 16px 5px; text-align:center; white-space:nowrap; border-radius:3px;
  background:linear-gradient(180deg,#2d3240,#14161c); border-top:2px solid #e3b85c; box-shadow:0 6px 10px rgba(0,0,0,.5)}
.m1-cab-chevalet b{display:block; font:800 14px/1.1 var(--display); color:#f6d88f; letter-spacing:.04em}
.m1-cab-chevalet small{display:block; font:600 9px/1.3 var(--doc); color:rgba(255,255,255,.78); letter-spacing:.16em; text-transform:uppercase}
.m1-cab-tampon{position:absolute; left:14px; bottom:24px; width:56px}
.m1-cab-tasse{position:absolute; right:12px; bottom:26px; width:58px}
.m1-cab-tampon svg,.m1-cab-tasse svg{width:100%; height:auto}
body[data-m1="briefing"] .goals{position:relative; gap:26px 22px; margin:26px 0 24px; padding:32px 28px 30px; border-radius:20px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px), repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 19px, rgba(0,0,0,.04) 19px 20px, transparent 20px 37px),
    radial-gradient(70% 70% at 30% 0%, rgba(255,220,160,.2), transparent 70%), linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.25)), linear-gradient(90deg,#5b3a22,#6d4528 18%,#5f3c23 37%,#77502f 58%,#64412a 79%,#573823);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), inset 0 -14px 34px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.45)}
body[data-m1="briefing"] .goal{position:relative; margin-top:10px; padding:20px 20px 18px; border:0; border-radius:2px 6px 6px 6px; color:#1d1a14;
  background-color:var(--chemise,#f2d68a); background-image:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 40%, rgba(0,0,0,.05));
  box-shadow:0 2px 2px rgba(0,0,0,.2), 0 14px 26px rgba(0,0,0,.42); transform:rotate(var(--r,0deg)); -webkit-backdrop-filter:none; backdrop-filter:none}
body[data-m1="briefing"] .goal::before{content:""; position:absolute; left:0; top:-11px; width:40%; height:12px; border-radius:6px 9px 0 0; background:var(--chemise,#f2d68a)}
body[data-m1="briefing"] .goal::after{content:""; position:absolute; right:22px; top:-10px; width:13px; height:38px; border:3px solid #c3c9d4; border-bottom-color:#8d94a5; border-radius:9px; transform:rotate(7deg); pointer-events:none}
body[data-m1="briefing"] .goal:nth-child(1){--chemise:#f2d68a; --r:-1deg}
body[data-m1="briefing"] .goal:nth-child(2){--chemise:#c4e3b4; --r:.8deg}
body[data-m1="briefing"] .goal:nth-child(3){--chemise:#f5c6d2; --r:.6deg}
body[data-m1="briefing"] .goal:nth-child(4){--chemise:#bcd8f2; --r:-.7deg}
body[data-m1="briefing"] .goal b{color:#1d1a14}
body[data-m1="briefing"] .goal p{color:#3d3526}
body[data-m1="briefing"] .today{gap:10px}
body[data-m1="briefing"] .today span{position:relative; padding:7px 13px 7px 25px; border:0; border-radius:3px 13px 13px 3px; color:#1f2433; background:#fffdf6; box-shadow:0 6px 14px rgba(0,0,0,.35)}
body[data-m1="briefing"] .today span::before{content:""; position:absolute; left:9px; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%; background:#2a2440; box-shadow:0 0 0 2px #e3dccb}

/* ─── 3. Activité : la rue commerçante le soir ; les fiches d'activité ─── */
.m1-rue{margin:0 0 6px; border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.14); box-shadow:0 22px 50px rgba(0,0,0,.45);
  background:linear-gradient(180deg,#0a0f30 0%,#1c1a4a 55%,#3a2a68 100%)}
.m1-rue svg{display:block; width:100%; height:auto}
body[data-m1="type"] .sector-h span{padding:6px 16px 5px; border-radius:9px 9px 2px 2px; color:#1f2433; background:#e8d6a8; font-size:14px; box-shadow:0 6px 14px rgba(0,0,0,.3)}
body[data-m1="type"] .sector-h.m1-onglet-0 span{background:#c4e3b4}
body[data-m1="type"] .sector-h.m1-onglet-1 span{background:#bcd8f2}
body[data-m1="type"] .sector-h.m1-onglet-2 span{background:#f2d68a}
body[data-m1="type"] .sector-h .rule{background:linear-gradient(90deg, rgba(255,255,255,.3), transparent)}
body[data-m1="type"] .choice[data-pick="type"]{--text:#1f2433; --muted:#454d63; --line2:rgba(31,36,51,.3); --coral:#b42318; --bande:#3a8f5c;
  color:var(--text); background-color:#fffdf6; background-image:var(--grain); border:1px solid rgba(31,36,51,.1); border-top:7px solid var(--bande); border-radius:4px;
  box-shadow:0 2px 3px rgba(0,0,0,.25), 0 16px 32px rgba(0,0,0,.38); -webkit-backdrop-filter:none; backdrop-filter:none}
body[data-m1="type"] .choice[data-pick="type"].sec-secondaire{--bande:#2f6db5}
body[data-m1="type"] .choice[data-pick="type"].sec-tertiaire{--bande:#c58a1b}
body[data-m1="type"] .choice[data-pick="type"]:hover{background-color:#fff; border-color:rgba(31,36,51,.22); border-top-color:var(--bande); transform:translateY(-2px)}
body[data-m1="type"] .choice[data-pick="type"].on{background-color:#fff3f8; border-color:#ff3d8b; border-top-color:#ff3d8b; box-shadow:0 0 0 3px rgba(255,61,139,.42), 0 18px 36px rgba(0,0,0,.42)}
body[data-m1="type"] .choice[data-pick="type"].full{opacity:.85; background-color:#e9e6df; border-top-color:#8a8f9c}
body[data-m1="type"] .choice[data-pick="type"].full::after{content:"Complet"; position:absolute; top:16px; right:16px; padding:5px 12px 4px; border:4px double #c62828; border-radius:8px; color:#c62828;
  font:800 17px/1.1 var(--doc); letter-spacing:.16em; text-transform:uppercase; transform:rotate(-10deg); opacity:.9; pointer-events:none}

/* ─── 4. Clientèle : l'étude de marché, sur papier, pincée dans un porte-documents ─── */
body[data-m1="clientele"] .card.m1-sondage{margin-top:36px; padding:20px 26px 18px}
body[data-m1="clientele"] .m1-sondage h3{color:#14284b}

/* ─── 5. Stratégie : des étiquettes de prix ; les raisons notées sur un post-it ─── */
.m1-etiq{position:absolute; top:-15px; right:48px; z-index:2; pointer-events:none}
.m1-etiq::before{content:""; position:absolute; left:4px; top:-9px; width:2px; height:20px; border-radius:1px; background:rgba(255,255,255,.6); transform:rotate(-28deg)}
.m1-etiq .cpt-etiquette{font-size:17px; padding:7px 12px 7px 25px}
.m1-etiq .cpt-etiquette small{font-size:9.5px}
body[data-m1="strategie"] .card.m1-postit{position:relative; border:0; border-radius:2px; padding:24px 24px 22px; color:#2b2618; --text:#2b2618; --muted:#463e2c; --line2:rgba(43,38,24,.4);
  background-color:#ffeb7a; background-image:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 35%); box-shadow:0 1px 1px rgba(0,0,0,.15), 0 18px 32px rgba(0,0,0,.42);
  transform:rotate(-.5deg); -webkit-backdrop-filter:none; backdrop-filter:none}
body[data-m1="strategie"] .card.m1-postit::before{content:""; position:absolute; top:-12px; left:50%; width:116px; height:26px; margin-left:-58px; background:rgba(255,255,255,.5); box-shadow:0 1px 2px rgba(0,0,0,.18); transform:rotate(-2deg); pointer-events:none}
body[data-m1="strategie"] .card.m1-postit .f{font:700 25px/1.1 var(--main)}

/* ─── 6. Identité : le dossier de marque posé sur le bureau ─── */
.m1-marque{position:relative; display:flex; align-items:flex-end; justify-content:center; gap:22px 26px; flex-wrap:wrap; margin:-4px 0 24px; padding:26px 22px 22px; border-radius:16px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px), radial-gradient(70% 80% at 30% 0%, rgba(255,220,160,.2), transparent 70%), linear-gradient(90deg,#5b3a22,#6d4528 18%,#5f3c23 37%,#77502f 58%,#64412a 79%,#573823);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), inset 0 -12px 30px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.4)}
.m1-mq-carte{position:relative; flex:none; width:min(312px,100%); aspect-ratio:1.75; display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; padding:14px 16px 12px 22px; overflow:hidden;
  background:#fff; color:#1f2433; border-radius:7px; box-shadow:0 2px 3px rgba(0,0,0,.25), 0 16px 28px rgba(0,0,0,.45); transform:rotate(-2deg); font:500 11px/1.35 var(--doc)}
.m1-mq-bande{position:absolute; left:0; top:0; bottom:0; width:8px}
.m1-mq-carte .logo-mark{border-width:3px}
.m1-mq-txt{display:grid; gap:1px; min-width:0}
.m1-mq-txt b{font-size:17px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m1-mq-txt i{color:#5b6478; margin-bottom:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m1-mq-txt span{color:#3a4052; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m1-mq-txt span:first-of-type{font-weight:700; color:#1f2433}
.m1-mq-sac{position:relative; flex:none; width:122px; height:140px; margin-top:28px; display:grid; justify-items:center; align-content:center; gap:7px; padding:10px 8px; text-align:center; border-radius:3px 3px 5px 5px;
  background:linear-gradient(90deg, rgba(0,0,0,.1), transparent 18%, transparent 82%, rgba(0,0,0,.12)), linear-gradient(180deg, rgba(0,0,0,.12) 0 6px, transparent 6px), #c9a273; box-shadow:0 14px 24px rgba(0,0,0,.45); transform:rotate(3deg)}
.m1-mq-anse{position:absolute; top:-27px; left:50%; width:56px; height:40px; margin-left:-28px; border:5px solid #8b6a3e; border-bottom:0; border-radius:28px 28px 0 0}
.m1-mq-sac b{max-width:100%; padding:2px 6px; border-radius:3px; background:#fffdf6; font-size:12.5px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m1-mq-nuancier{flex:none; display:flex; gap:10px; align-items:flex-end}
.m1-mq-pastille{display:grid; width:66px; padding:5px 5px 7px; background:#fff; border-radius:3px; box-shadow:0 10px 18px rgba(0,0,0,.4); font:700 9.5px/1.2 var(--doc); color:#1f2433; text-align:center}
.m1-mq-pastille:nth-child(1){transform:rotate(-6deg)}
.m1-mq-pastille:nth-child(2){transform:rotate(5deg) translateY(4px)}
.m1-mq-pastille i{display:block; height:60px; margin-bottom:6px; border-radius:2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ─── 7. Boutique : la maquette de la façade, mise en lumière ; l'enseigne qui s'allume ─── */
body[data-m1="boutique"] .front-wrap.m1-maquette{position:relative; padding:10px 10px 0; border:0; border-radius:16px; background:linear-gradient(180deg,#2a2040,#17122a);
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 0 80px color-mix(in srgb, var(--brand) 32%, transparent), 0 30px 60px rgba(0,0,0,.55)}
body[data-m1="boutique"] .m1-maquette svg.front{border-radius:8px}
@media (min-width:901px){ body[data-m1="boutique"] .front-wrap.m1-maquette{position:sticky; top:96px} }
.m1-spot{position:absolute; left:8%; right:8%; top:-6px; height:46px; pointer-events:none; z-index:1;
  background:radial-gradient(60% 100% at 50% 0%, rgba(255,240,200,.32), transparent 70%)}
.m1-plaque-facade{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 -10px; padding:11px 16px 12px;
  font:700 11px var(--doc); letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.74)}
.m1-plaque-facade b{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:800 14px var(--doc); letter-spacing:.02em; text-transform:none; color:#f6d88f}
.m1-allumage{animation:m1-allumage 1.9s linear both}
@keyframes m1-allumage{0%{filter:brightness(.22) saturate(.4)} 14%{filter:brightness(.95)} 19%{filter:brightness(.3) saturate(.45)} 31%{filter:brightness(1.06)} 35%{filter:brightness(.5) saturate(.6)} 50%,100%{filter:none}}
/* Échantillons de matériaux devant chaque option */
body[data-m1="boutique"] .opt[data-set="facade"]::before, body[data-m1="boutique"] .opt[data-set="auvent"]::before{content:""; flex:none; width:26px; height:18px; border-radius:4px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3)}
body[data-m1="boutique"] .opt[data-val="brique"]::before{background:repeating-linear-gradient(0deg, #e6d9c4 0 1px, transparent 1px 6px), repeating-linear-gradient(90deg, #e6d9c4 0 1px, transparent 1px 10px), #a8543c}
body[data-m1="boutique"] .opt[data-val="bois"]::before{background:repeating-linear-gradient(0deg, #5e3b1d 0 1px, #966233 1px 6px, #87552a 6px 9px)}
body[data-m1="boutique"] .opt[data-val="pierre"]::before{background:repeating-linear-gradient(0deg, #9b907c 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, #9b907c 0 1px, transparent 1px 13px), #d5cab8}
body[data-m1="boutique"] .opt[data-val="moderne"]::before{background:linear-gradient(90deg, #3f444d 0 47%, #1d2026 47% 53%, #393e46 53%)}
body[data-m1="boutique"] .opt[data-val="raye"]::before{background:repeating-linear-gradient(90deg, var(--brand) 0 4px, #f6f1e6 4px 8px)}
body[data-m1="boutique"] .opt[data-val="uni"]::before{background:var(--brand)}
body[data-m1="boutique"] .opt[data-val="sans"]::before{background:linear-gradient(135deg, transparent 44%, #c9ced8 44% 56%, transparent 56%), rgba(255,255,255,.06)}

/* ─── 8. Local : petites annonces sur le liège, résumé du bail en contrat, plaque de rue ─── */
body[data-m1="local"] .grid.g3.m1-liege{gap:28px 22px; padding:34px 26px 28px}
body[data-m1="local"] .choice[data-set="emplacement"]{--text:#1f2433; --muted:#454d63; --mint:#0d7347; --coral:#b42318; --gold2:#5f430a; --line2:rgba(31,36,51,.3);
  color:var(--text); padding:0 18px; border:0; border-radius:2px; background-color:#fffdf6; background-image:var(--grain);
  box-shadow:0 2px 3px rgba(0,0,0,.3), 0 14px 24px rgba(0,0,0,.38); transform:rotate(var(--r,0deg)); -webkit-backdrop-filter:none; backdrop-filter:none}
body[data-m1="local"] .choice[data-set="emplacement"]:nth-child(1){--r:-1.2deg}
body[data-m1="local"] .choice[data-set="emplacement"]:nth-child(2){--r:.9deg}
body[data-m1="local"] .choice[data-set="emplacement"]:nth-child(3){--r:-.6deg}
body[data-m1="local"] .choice[data-set="emplacement"]:hover{background-color:#fff; transform:translateY(-2px)}
body[data-m1="local"] .choice[data-set="emplacement"].on{background-color:#fff3f8; box-shadow:0 0 0 3px #ff3d8b, 0 0 30px rgba(255,61,139,.45), 0 14px 24px rgba(0,0,0,.38)}
body[data-m1="local"] .choice[data-set="emplacement"].on::before{top:48px}
body[data-m1="local"] .choice[data-set="emplacement"]::after{content:""; position:absolute; top:-9px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%; z-index:3; pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #fff 0 2px, #e04848 3px, #8e1f1f 100%); box-shadow:2px 4px 4px rgba(0,0,0,.4)}
body[data-m1="local"] .choice[data-set="emplacement"].on::after{background:radial-gradient(circle at 35% 30%, #fff 0 2px, #ff3d8b 3px, #8a1f4a 100%)}
body[data-m1="local"] .choice[data-set="emplacement"] .cost{background:#ffe873; color:#2b2618; font-weight:600}
.m1-annonce-tete{display:block; margin:0 -18px 14px; padding:9px 12px 7px; text-align:center; color:#fff; background:#c62828; font:800 15px/1 var(--doc); letter-spacing:.26em; text-transform:uppercase}
.m1-languettes{display:flex; margin:16px -18px 0; height:46px; border-top:1.5px dashed rgba(31,36,51,.4)}
.m1-languettes i{flex:1; border-right:1.5px dashed rgba(31,36,51,.3); background:linear-gradient(90deg, transparent 44%, rgba(31,36,51,.16) 44% 56%, transparent 56%) center/100% 70% no-repeat}
.m1-languettes i:last-child{border-right:0}
.m1-languettes i:nth-child(3){opacity:0}
body[data-m1="local"] .card.m1-bail{padding:28px 28px 20px}
body[data-m1="local"] .m1-bail h3{color:#14284b}
.m1-bail-pied{display:grid; grid-template-columns:1fr 1fr; gap:10px 28px; margin-top:18px; padding-top:12px; border-top:1px dashed rgba(31,36,51,.3); font:600 11px var(--doc); letter-spacing:.12em; text-transform:uppercase; color:#4a5068}
.m1-bail-pied > span{display:grid; gap:2px; padding-bottom:3px; border-bottom:1px solid rgba(31,36,51,.35)}
.m1-bail-pied .cpt-fictif{grid-column:1 / -1; margin-top:2px}
.m1-plaque-rue{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; margin-top:14px}
.m1-pr-nom,.m1-pr-num{border-radius:8px; background:#1f4f9e; color:#fff; box-shadow:inset 0 0 0 3px #1f4f9e, inset 0 0 0 5px #fff, 0 10px 20px rgba(0,0,0,.45)}
.m1-pr-nom{display:grid; padding:9px 20px 8px; font:800 19px/1.15 var(--doc); letter-spacing:.02em}
.m1-pr-nom small{margin-top:2px; font:600 11px/1.2 var(--doc); letter-spacing:.14em; text-transform:uppercase; opacity:.88}
.m1-pr-num{display:grid; place-items:center; min-width:56px; padding:6px 12px; font:800 25px var(--doc)}

/* ─── 9. Forme juridique : au guichet d'entreprises ou chez le notaire ─── */

const partEmpruntAnnee = () => { const P = emprunt(); if (!P) return 0; const i = TAUX / 12, m = mensualite(); let reste = P, part = 0;

  const base = "1" + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const n = base + String(97 - (parseInt(base,10) % 97)).padStart(2,"0");

}
function mod97(str){ let r = 0; for (const ch of str) r = (r*10 + +ch) % 97; return r; }
function genIBAN(){
  const bank = ["001","063","068","310","363","523","732","751"][Math.floor(Math.random()*8)];

  const bban = b10 + String(mod97(b10) || 97).padStart(2,"0");
  const iban = "BE" + String(98 - mod97(bban + "111400")).padStart(2,"0") + bban;

/** Appelle une fonction de la base. Erreurs possibles : « reseau », « timeout », « serveur ». */
async function rpc(fonction, args, timeout = 15000, keepalive = false){
  if (CONFIG.HORS_LIGNE) throw new Error("reseau");
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/rpc/" + fonction, { method:"POST", keepalive, signal:ctrl.signal,
      headers:{ "apikey":CONFIG.SUPABASE_CLE, "Content-Type":"application/json" }, body:JSON.stringify(args) });
    if (!r.ok) throw new Error("serveur");
    return await r.json();
  } catch(e) {
    throw new Error(e.name === "AbortError" ? "timeout" : e.message === "serveur" ? "serveur" : "reseau");
  } finally { clearTimeout(t); }
}
/** Lectures « ping » (l'accès est-il ouvert ?) et « connexion » (tout ce qu'il faut au démarrage).
 *  Le nom « jsonp » est historique : ce n'est plus du JSONP, mais l'appel garde sa forme et ses réponses. */
function jsonp(params, timeout = 15000){
  const mission = String(params.mission || CONFIG.MISSION);
  return params.action === "ping" ? rpc("mc_ping", { p_mission:mission }, timeout)
    : rpc("mc_connexion", { p_email:params.email, p_mission:mission }, timeout);
}
/** Enregistre le travail. Réponse : { ok, statut } ou { ok:false, erreur } ; null si le réseau a échoué. */

  return rpc("mc_enregistrer", { p_paquet:data }, 20000).catch(() => null);
}

// ======================================================================
//  SAUVEGARDES ESPACÉES : au plus un envoi « en cours » toutes les 10 s par élève (sauf étape importante)
// ======================================================================
let DERNIERE_SAUVEGARDE = 0, SAUVEGARDE_PREVUE = null, DERNIER_PING = 0;
const PAUSE_SAUVEGARDE = 10000, PAUSE_PING = 30000;
function sauvegarder(force){
  const ecoule = Date.now() - DERNIERE_SAUVEGARDE;
  if (force || ecoule >= PAUSE_SAUVEGARDE){ annulerSauvegardePrevue(); DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); return; }
  if (!SAUVEGARDE_PREVUE) SAUVEGARDE_PREVUE = setTimeout(() => {
    SAUVEGARDE_PREVUE = null;
    if (MODE === "mission"){ DERNIERE_SAUVEGARDE = Date.now(); envoyer("en_cours"); }
  }, PAUSE_SAUVEGARDE - ecoule + Math.random() * 3000);
}
function annulerSauvegardePrevue(){ clearTimeout(SAUVEGARDE_PREVUE); SAUVEGARDE_PREVUE = null; }
const pingAutorise = () => { if (Date.now() - DERNIER_PING < PAUSE_PING) return false; DERNIER_PING = Date.now(); return true; };
// Si l'élève ferme la page avec une sauvegarde en attente, on l'envoie quand même (requête « keepalive »).
window.addEventListener("pagehide", () => {
  if (SAUVEGARDE_PREVUE && MODE === "mission"){
    try { rpc("mc_enregistrer", { p_paquet:payload("en_cours") }, 10000, true).catch(() => {}); } catch(e) {}
  }
});

function jaugeAutonomie(){
  const a = autonomie(), pct = a == null ? 0 : Math.min(100, Math.round(a / 12 * 100));

  return `<div class="big-n ${cls}" style="color:${cls === "bad" ? "var(--coral)" : cls === "warn" ? "var(--amber)" : "var(--mint)"}">${a == null ? "–" : a}<small> mois d'autonomie</small></div>

R.financement = () => {

  if (financementPret() && autonomie() != null && autonomie() < 3) conseil = `Attention : avec <b class="money">${euro(tresorerie())}</b> en banque et <b class="money">${euro(chargesMensuelles())}</b> de charges fixes par mois, tu ne tiens que ${autonomie()} mois sans vendre. Augmente ton apport, demande un emprunt… ou choisis un local moins cher.`;
  else if (S.apport && S.emprunt != null && !acc) conseil = `La banque a refusé : elle exige au moins <b>${Math.round(PART_PROPRE_MIN*100)} % de fonds propres</b>. Avec ${euro(capital())} de capital, elle prête au maximum <b class="money">${euro(empruntMax())}</b>. Demande moins… ou apporte plus.`;
  else if (financementPret()) conseil = `Plan financier équilibré : besoins = ressources. Tes fonds propres représentent <b>${pctProp} %</b> du financement. ${emprunt() ? `L'emprunt te coûtera <b class="money">${euro(interetsTotaux())}</b> d'intérêts sur 5 ans.` : "Sans emprunt, pas d'intérêts à payer, mais moins de trésorerie pour démarrer."}`;
  return head(8, "Finance <span class='grad'>ton projet</span>", `Tu disposes de ${euro(ECONOMIES)} d'économies personnelles. Ce que tu apportes devient le capital de l'entreprise. Pour le reste, il y a la banque.`) + coach("financement", conseil)
    + `<div class="card"><h3>1. Ton apport au capital</h3><p class="help" style="margin:0 0 6px">${S.direction === "plusieurs" ? "Ce que tu mets dans la société ne t'appartient plus : il appartient à la SRL. C'est l'apport des fondateurs (depuis 2019, une SRL n'a plus de capital)." : "Cet argent reste à toi, mais il est affecté à ton activité : tu le suivras dans ta comptabilité. C'est le capital de ton entreprise individuelle."} Le reste de tes économies reste privé.</p>
      <div class="money-opts">${APPORTS.map(a => `<button class="choice ${S.apport === a ? "on" : ""}" data-set="apport" data-val="${a}"><b>${euro(a)}</b><small>${a === ECONOMIES ? "toutes tes économies" : "il te reste " + euro(ECONOMIES - a) + " en privé"}</small></button>`).join("")}</div>
      ${S.apport ? `<div class="note" style="margin:14px 0 0"><span class="i">💼</span><div>${S.direction === "plusieurs" ? "Apport des fondateurs de" : "Capital de"} <b>${esc(deno())}</b> : ${nbFondateurs() > 1 ? `${nbFondateurs()} fondateurs × ${euro(S.apport)} = ` : ""}<b class="money">${euro(capital())}</b>. ${nbFondateurs() > 1 ? "Tes associés apportent autant que toi." : ""}</div></div>` : ""}</div>
    <div class="card" style="margin-top:14px"><h3>2. Ta demande de crédit à la banque</h3><p class="help" style="margin:0 0 6px">Crédit d'investissement à ${(TAUX*100).toLocaleString("fr-BE")} % par an, remboursé en ${DUREE_MOIS/12} ans. La banque exige au moins ${Math.round(PART_PROPRE_MIN*100)} % de fonds propres.</p>
      <div class="money-opts">${EMPRUNTS.map(a => `<button class="choice ${S.emprunt === a ? "on" : ""}" data-set="emprunt" data-val="${a}" ${S.apport ? "" : "disabled"}><b>${a ? euro(a) : "Aucun"}</b><small>${a ? "≈ " + euro(r2(a * (TAUX/12) / (1 - Math.pow(1 + TAUX/12, -DUREE_MOIS)))) + " / mois" : "pas d'intérêts"}</small></button>`).join("")}</div>
      ${okBank && S.apport ? `<div class="bank"><div><b>Borinage Banque · décision de crédit</b><div class="help" style="margin-top:2px">${acc ? (S.emprunt ? `Accordé. Fonds propres ${pctProp} % · mensualité <b class="money">${euro(mensualite())}</b> pendant ${DUREE_MOIS} mois · intérêts totaux <b class="money">${euro(interetsTotaux())}</b>.` : "Pas de crédit demandé : tu finances tout avec le capital.") : `Refusé : ${euro(S.emprunt)} représenterait ${Math.round(S.emprunt / (S.emprunt + capital()) * 100)} % du financement par la dette. Maximum accordable avec ton capital : ${euro(empruntMax())}.`}</div></div><div class="dec ${acc ? "ok" : "ko"}">${acc ? (S.emprunt ? "✔ Crédit accordé" : "— Sans crédit") : "✘ Crédit refusé"}</div></div>` : ""}</div>
    ${S.apport && okBank && acc ? `<div class="card" style="margin-top:14px"><h3>3. Ton plan financier</h3>${planFinancier()}
      <div class="grid g2" style="margin-top:16px;align-items:start"><div><h3 class="sub" style="margin-top:0">Sorties fixes chaque mois</h3><table class="led"><tbody>
        <tr><td>Loyer</td><td class="n">${euro(loyer())}</td></tr>${CHARGES_LIGNES.map(c => `<tr><td>${esc(c.nom)}${c.tva ? ` <small style="color:var(--muted)">(${euro(c.ht)} HT + ${euro(r2(c.ht * c.tva))} de TVA récupérable)</small>` : ""}</td><td class="n">${euro(r2(c.ht * (1 + c.tva)))}</td></tr>`).join("")}<tr><td>Mensualité de l'emprunt${emprunt() ? ` <small style="color:var(--muted)">(${euro(r2(emprunt() * TAUX / 12))} d'intérêts + ${euro(r2(mensualite() - r2(emprunt() * TAUX / 12)))} de capital)</small>` : ""}</td><td class="n">${euro(mensualite())}</td></tr>
        <tr class="tot"><td>Total à sortir chaque mois</td><td class="n">${euro(chargesMensuelles())}</td></tr><tr><td><small>dont charges au compte de résultats (loyer, assurances, énergie, télécom HT, intérêts)</small></td><td class="n">${euro(chargesCR())}</td></tr></tbody></table>${emprunt() ? `<p class="help">Pourquoi ${euro(interetsTotaux())} d'intérêts sur 5 ans, et pas ${euro(emprunt() * TAUX * 5)} (${euro0(emprunt())} × 4 × 5 ÷ 100) ? Parce que chaque mois tu rembourses une partie du capital : les intérêts se calculent sur ce qui reste dû. 1er mois : ${euro0(emprunt())} × 4 ÷ 1 200 = ${euro(r2(emprunt() * TAUX / 12))} (la formule de la fiche 350) ; 2e mois : ${euro(r2(emprunt() - (mensualite() - r2(emprunt() * TAUX / 12))))} × 4 ÷ 1 200 = ${euro(r2(r2(emprunt() - (mensualite() - r2(emprunt() * TAUX / 12))) * TAUX / 12))}…</p>` : ""}</div>
        <div><h3 class="sub" style="margin-top:0">Combien de temps tiens-tu sans vendre ?</h3>${jaugeAutonomie()}</div></div>
      ${tresorerie() < TRESO_MIN ? `<div class="note bad"><span class="i">🚨</span><div>Trésorerie de départ insuffisante (<b class="money">${euro(tresorerie())}</b>). Il faut au moins ${euro(TRESO_MIN)} pour payer les premières factures : augmente ton apport ou ton emprunt.</div></div>` : ""}</div>` : ""}
    ${quiz("financement")}` + nav("financement");
};

    : e.mode === "err" ? `<div class="status err">L'envoi n'a pas pu être confirmé. Vérifie ta connexion puis clique sur « Réessayer l'envoi ». <button class="btn btn-ghost" data-act="resend" style="padding:8px 16px;font-size:14px">Réessayer l'envoi</button></div>`
    : `<div class="status wait"><span class="spin"></span>Enregistrement chez ton professeur en cours…</div>`;
  return `<div class="hero" style="padding-top:6px"><div class="kick">${lecture ? "Mission 1 terminée" : "Mission 1 accomplie"}</div>
      <h2 style="font-size:clamp(32px,4.8vw,54px)"><span class="grad">${esc(deno())}</span> est fondée.</h2><p class="lead">${esc(S.slogan)} — Bravo ${esc(S.eleve.prenom)}.</p></div>
    ${status}
    <div class="stats"><div class="stat"><b>${S.xp}</b><span>XP gagnés</span></div><div class="stat"><b style="font-family:var(--display);font-size:20px;padding:4px 0">${niveau()}</b><span>Ton niveau</span></div>
      <div class="stat"><b>${badges.filter(b => b[1]).length}/${badges.length}</b><span>Badges</span></div><div class="stat"><b>${defis}/${Object.keys(QUIZ).length}</b><span>Défis éclair réussis</span></div></div>
    <h3 class="sub">Ton tableau de bord de départ</h3>
    <div class="stat3 five">
      <div class="s"><span>${S.direction === "plusieurs" ? "Apport" : "Capital"}</span><b>${euro(capital())}</b></div><div class="s"><span>Emprunt</span><b>${euro(emprunt())}</b></div><div class="s"><span>Trésorerie</span><b style="color:var(--mint)">${euro(tresorerie())}</b></div><div class="s"><span>Sorties fixes / mois</span><b>${euro(chargesMensuelles())}</b></div><div class="s"><span>Autonomie</span><b>${autonomie()} mois</b></div></div>
    <div class="duo"><div class="front-wrap">${vitrine("fin")}</div><div>${carteVisite()}<p class="help">Ta carte de visite de chef d'entreprise.</p></div></div>
    <div class="duo" style="align-items:start"><div>${extraitBCE()}</div><div>${carteBancaire()}<div style="margin-top:14px">${bilanHTML({foot:false})}</div></div></div>
    <div class="card" style="margin-top:22px"><h3 class="sub" style="margin-top:0">Tes badges</h3>
      <div class="badges">${badges.map(([b,on]) => `<div class="badge ${on ? "" : "lockd"}"><div class="i">${on ? b[0] : "🔒"}</div><b>${esc(b[1])}</b></div>`).join("")}</div>
      <h3 class="sub">Ton carnet de mots de pro</h3>
      <div class="words">${S.mots.map(m => `<div class="word"><b>${esc(MOTS[m].mot)}</b><span>${esc(MOTS[m].def)}</span></div>`).join("")}</div>
      <div class="nav" style="margin-top:22px"><button class="btn btn-ghost" data-act="print">Imprimer mon dossier de fondation</button></div></div>
    <div class="next"><div class="ic">🧰</div><div><b>Prochaine mission : équipe ton entreprise.</b><br><span class="help" style="margin:0">Avec les ${euro(tresorerie())} de ton compte, tu achèteras le matériel nécessaire : mobilier, caisse, ordinateur… en comparant les offres des fournisseurs, sans vider la trésorerie.</span></div></div>`;
};

function stepsStrip(){
  if (MODE !== "mission" || S.step > N_STEPS) return "";
  return `<div class="steps">${STEPS.slice(1, N_STEPS + 1).map((s,i) => { const n = i+1, cls = S.step > n ? "done" : (S.step === n ? "now" : "");
    return `<span class="stp ${cls}"><span class="n">${S.step > n ? "✓" : n}</span><span class="lab">${esc(s.label)}</span></span>`; }).join("")}</div>
    <div class="steps-bar"><i style="width:${Math.round((S.step - 1) / N_STEPS * 100)}%"></i></div>`;
}
function renderRail(){ $("#rail").innerHTML = ""; }
function renderSide(){
  const side = $("#side"), layout = $("#layout");
  if (MODE !== "mission" || S.step > N_STEPS){ side.innerHTML = ""; layout.classList.add("solo"); return; }
  layout.classList.remove("solo");
  const key = STEPS[S.step].key, t = type(), st = strat(), ci = cible(), e = empl();
  const rows = [["Activité", t ? `${t.emoji} ${t.nom}` : ""], ["Clientèle", ci ? `${ci.emoji} ${ci.nom}` : ""], ["Positionnement", st ? `${st.icone} ${st.nom}` : ""],
    ["Siège", adresse1() && commune() ? `${adresse1()}, ${adresse2()}` : ""], ["Local", e ? `${e.nom} · ${euro(e.loyer)}/mois` : ""], ["Forme", formeCourte()]];
  const filled = [t, ci, st, VALID.identite(), VALID.boutique(), VALID.local(), S.direction, financementPret(), S.ids, S.done.lancement].filter(Boolean).length;
  const pct = Math.round(filled / N_STEPS * 100), a = autonomie();
  side.innerHTML = `<div class="dash">
    ${key === "boutique" ? "" : `<div class="front-wrap">${vitrine("side")}</div>`}
    <div class="box"><h3>Mon entreprise ${S.nom.trim() ? `<b>${esc(deno())}</b>` : ""}</h3>
      ${rows.map(r => `<div class="srow"><span class="k">${r[0]}</span><span class="v ${r[1] ? "" : "todo"}">${r[1] ? esc(r[1]) : "à décider"}</span></div>`).join("")}
      ${S.direction && S.apport ? `<div class="m3" style="margin-top:10px"><div>Trésorerie<b style="color:${tresorerie() < TRESO_MIN ? "var(--coral)" : "var(--mint)"}">${euro0(tresorerie())}</b></div><div>Sorties / mois<b>${euro0(chargesMensuelles())}</b></div><div>Autonomie<b style="color:${a == null ? "" : a < 3 ? "var(--coral)" : a < 6 ? "var(--amber)" : "var(--mint)"}">${a == null ? "–" : a + " mois"}</b></div></div>` : ""}
      <div class="pbar"><i style="width:${pct}%"></i></div><div class="help">Fondation à ${pct} %</div></div>
  </div>`;
}
function updateTop(){
  const enMission = MODE === "mission" || MODE === "consultation";
  $("#xpBox").hidden = !enMission; $("#xpBox").innerHTML = `${S.xp} XP <small>· ${esc(niveau())}</small>`;
  $("#who").innerHTML = MODE !== "login" && S.eleve.email ? `<b>${esc(S.eleve.prenom)} ${esc(S.eleve.nom)}</b><button data-act="logout">Changer de compte</button>` : "";
  const mk = $("#mark");
  if (enMission && S.symbole){ mk.className = "mark emo"; mk.textContent = S.symbole; } else { mk.className = "mark"; mk.textContent = "SL"; }
  $("#topTitle").childNodes[0].textContent = enMission && S.nom.trim() ? deno() : "Fonde ton entreprise";
  $("#topSub").textContent = MODE === "consultation" ? "Mission 1 accomplie" : MODE === "mission" ? `Mission 1 · décision ${Math.min(S.step, N_STEPS)}/${N_STEPS}` : "Mission 1 · Institut Saint-Luc de Frameries";
  const k = $("#kpis");
  if (!enMission || !S.direction || !S.apport){ k.innerHTML = ""; return; }
  const a = autonomie(), cls = a == null ? "" : a < 3 ? "bad" : a < 6 ? "warn" : "ok";
  k.innerHTML = `<div class="kpi ${tresorerie() < TRESO_MIN ? "bad" : "ok"}"><span>Trésorerie</span><b>${euro(tresorerie())}</b></div>
    <div class="kpi"><span>Sorties fixes / mois</span><b>${euro(chargesMensuelles())}</b></div>
    <div class="kpi ${cls}"><span>Autonomie</span><b>${a == null ? "–" : a + " mois"}</b></div>`;
}

// ======================================================================
//  CONNEXION, SAUVEGARDE, NAVIGATION
// ======================================================================
const ERREURS = {
  email_invalide:"Cette adresse n'est pas valide. Elle doit ressembler à prenom.nom@istlm.org.",
  non_inscrit:"Cette adresse n'est pas sur la liste de ta classe. Vérifie l'orthographe ou demande à ton professeur.",
  reseau:"Impossible de joindre le serveur. Vérifie ta connexion internet puis réessaie.",
  timeout:"Le serveur ne répond pas pour l'instant. Patiente quelques secondes, puis clique à nouveau.",
  serveur:"Le serveur a refusé la demande. Préviens ton professeur."
};
async function seConnecter(email){
  LOGIN.busy = true; LOGIN.err = ""; LOGIN.lent = false; render();
  SESSION.email = email;
  const lent = setTimeout(() => { if (LOGIN.busy){ LOGIN.lent = true; render(); } }, 6000);
  let r;
  try { r = await connexion(); } catch(e) { clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false; LOGIN.err = ERREURS[e.message] || ERREURS.reseau; render(); return; }
  clearTimeout(lent); LOGIN.busy = false; LOGIN.lent = false;
  if (!r || !r.ok){ LOGIN.err = ERREURS[r && r.erreur] || "Connexion refusée. Demande à ton professeur."; render(); return; }
  appliquerConnexion(r, email);
}
function identite(email, ...sources){
  const id = Object.assign({email}, nomDepuisEmail(email), {classe:CONFIG.CLASSE_DEFAUT});
  sources.forEach(s => { if (s) ["prenom","nom","classe"].forEach(k => { if (s[k] && String(s[k]).trim()) id[k] = String(s[k]).trim(); }); });
  id.email = email;
  return id;
}
function appliquerConnexion(r, email){
  SESSION.diag = r.diagnostic || null;
  SESSION.compteurs = r.compteurs || {}; SESSION.max = r.max != null ? r.max : 4; SESSION.reouvert = false;
  const m = r.dossier && r.dossier.missions ? r.dossier.missions[CONFIG.MISSION] : null;
  const serveur = m && m.etatApp && m.etatApp.v === 4 ? m.etatApp : null;
  const ancienneVersion = m && m.etatApp && m.etatApp.v !== 4;   // dossier d'une ancienne version de l'application
  const local = lireLocal(email);
  const idEleve = identite(email, r.dossier && r.dossier.eleve, r.eleve);

  if (r.statut === "termine" && serveur){
    S = restaurer(serveur); MODE = "consultation"; S.step = N_STEPS + 1; S.envoi = {mode:"ok"};
  } else if (r.statut === "termine" && ancienneVersion){
    S = restaurer(null); MODE = "ancien";
  } else if (!r.ouvert){
    S = restaurer(serveur || local); MODE = "ferme";
  } else if (r.statut === "reinitialise"){
    S = restaurer(serveur); S.step = 1; S.done = {}; S.xp = 0; S.mots = []; S.bonusDone = {}; S.quiz = {}; S.envoi = null; S.finishedAt = null;
    S.engagement = false; S.signature = ""; S.briefing = true;
    SESSION.reouvert = true; MODE = "mission";
  } else if (r.statut === "en_cours"){
    const dernierServeur = m.dernier_envoi ? Date.parse(m.dernier_envoi) : 0;
    S = restaurer(local && local.majLocale > dernierServeur ? local : serveur); MODE = "mission";
  } else {
    S = restaurer(local && local.step <= N_STEPS ? local : null); MODE = "mission";
  }
  S.eleve = idEleve;
  if (!S.startedAt) S.startedAt = Date.now();
  if (MODE === "mission" && (S.step < 1 || S.step > N_STEPS)) S.step = 1;
  if (MODE === "mission" && !S.briefing) MODE = "briefing";
  save(); render(true);
}
R.ancien = () => `<div class="hero" style="text-align:center;margin:0 auto"><div style="font-size:60px">🗂️</div>
  <h2 style="max-width:none;font-size:clamp(30px,4vw,46px)">Mission déjà terminée</h2>
  <p class="lead" style="margin:0 auto">${esc(S.eleve.prenom)}, ton entreprise a été créée avec une ancienne version de l'application. Elle est bien enregistrée chez ton professeur. Pour la refaire avec cette nouvelle version, demande-lui de réinitialiser ta mission.</p></div>`;
async function verifierOuvert(){
  try { const r = await jsonp({action:"ping", mission:CONFIG.MISSION}, 10000); if (r && r.diagnostic) SESSION.diag = r.diagnostic;
    return !!(r && r.acces && (r.missionsOuvertes || []).indexOf(CONFIG.MISSION) >= 0); }
  catch(e) { return true; }
}
async function controlerEnFond(key){
  if (pingAutorise() && !(await verifierOuvert())){
    annulerSauvegardePrevue(); if (MODE === "mission"){ MODE = "ferme"; save(); render(true); } return; }
  if (key === "type"){
    await wait(3500);
    try {
      const r = await connexion();
      if (!r || !r.ok || MODE !== "mission") return;
      SESSION.compteurs = r.compteurs || {}; if (r.max != null) SESSION.max = r.max;
      const surServeur = r.dossier && r.dossier.entreprise ? r.dossier.entreprise.typeId : null;
      if (surServeur !== S.typeId && complet(S.typeId)){
        S.typeId = null; S.clientele = null; S.strategie = null; S.raisons = []; S.symbole = null; S.step = 1; save(); render(true);
        toast("<div>Oups ! Cette activité vient d'être complétée par tes camarades. Choisis-en une autre : tes autres choix sont gardés.</div>");
      }
    } catch(e) {}
  }
}
let MAJ_COMPTEURS = 0;
function rafraichirCompteurs(){
  if (Date.now() - MAJ_COMPTEURS < 20000) return;
  MAJ_COMPTEURS = Date.now();
  connexion().then(r => {
    if (!r || !r.ok) return;
    SESSION.compteurs = r.compteurs || {}; if (r.max != null) SESSION.max = r.max;
    if (!r.ouvert && MODE === "mission"){ MODE = "ferme"; save(); render(true); return; }
    if (MODE === "mission" && STEPS[S.step].key === "type") render();
  }).catch(() => {});
}
function suivant(){
  const key = STEPS[S.step].key;
  if (!VALID[key]()) return;
  const st = STEPS[S.step];
  award(key, 100, st.badge);
  const mots = (st.mots || []).slice();
  if (key === "forme") mots.push(S.direction === "plusieurs" ? "srl" : "individuelle");
  if (key === "local") mots.push("garantie");
  unlockMots(mots);
  S.step++;
  save(); render(true);
  sauvegarder(key === "type" || key === "officiel");
  controlerEnFond(key);
}
async function envoyerFinal(){
  if (!VALID.lancement()) return;
  award("lancement", 100, STEPS[N_STEPS].badge);
  annulerSauvegardePrevue();
  S.finishedAt = Date.now(); S.step = N_STEPS + 1; S.envoi = {mode:"wait"};
  save();
  setTimeout(() => { render(true); confetti(); }, 500);
  const res = await envoyer("termine");
  await confirmerEnvoi(res);
}
/** La base répond tout de suite ; si la réponse s'est perdue, on vérifie en relisant le dossier. */
async function confirmerEnvoi(res){
  if (res && (res.ok || res.erreur === "mission_deja_terminee")){ S.envoi = {mode:"ok"}; save(); render(); return; }
  if (res && (res.erreur === "acces_ferme" || res.erreur === "mission_fermee")){ S.envoi = {mode:"ferme"}; save(); render(); return; }
  for (let i = 0; i < 4; i++){
    await wait(2000 + i*1500);
    try {
      const r = await connexion();
      if (r && r.ok && r.statut === "termine"){ S.envoi = {mode:"ok"}; save(); render(); return; }
      if (r && r.ok && !r.ouvert){ S.envoi = {mode:"ferme"}; save(); render(); return; }
    } catch(e) {}
  }
  S.envoi = {mode:"err"}; save(); render();
}
function render(scroll){
  setBrand(MODE === "login" ? null : S.couleur);
  const key = MODE === "login" ? "login" : MODE === "ferme" ? "ferme" : MODE === "ancien" ? "ancien" : MODE === "briefing" ? "briefing" : MODE === "consultation" ? "fin" : STEPS[S.step].key;
  $("#main").innerHTML = stepsStrip() + R[key]();
  updateTop(); renderRail(); renderSide();
  if (key === "type") rafraichirCompteurs();
  if (MODE === "login"){ const em = $("#em"); if (em && !LOGIN.busy) em.focus(); }
  if (scroll) window.scrollTo({top:0, behavior:"smooth"});
}
function refreshLive(){
  if (MODE !== "mission") return;
  const key = STEPS[S.step].key; if (!VALID[key]) return;
  const ok = VALID[key]();
  document.querySelectorAll('[data-act="next"],[data-act="send"]').forEach(b => b.disabled = !ok);
  const hint = $("#main .nav .hint"); if (hint) hint.style.visibility = ok ? "hidden" : "visible";
  if (key === "lancement"){ const lis = document.querySelectorAll(".chk li"); if (lis.length){ lis[0].classList.toggle("ok", S.engagement); lis[1].classList.toggle("ok", S.signature.trim().length >= 3); } }
  if (key === "identite"){ const lp = $(".logo-prev"); if (lp) lp.outerHTML = logoBlock(); document.querySelectorAll(".stylebtn").forEach(b => { b.childNodes[0].textContent = S.nom.trim() || "Ton nom"; }); }
  updateTop(); renderSide();
}
function setPath(path, val){ const p = path.split("."); let o = S; while (p.length > 1) o = o[p.shift()]; o[p[0]] = val; }

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "em"){ LOGIN.email = el.value; const b = $('[data-act="login"]'); if (b) b.disabled = !emailOk(el.value.trim().toLowerCase()); return; }
  if (MODE !== "mission" || !el.dataset.bind) return;
  setPath(el.dataset.bind, el.value); save();
  if (el.dataset.bind === "nom" || el.dataset.bind === "slogan") document.querySelectorAll(`.chip[data-set="${el.dataset.bind}"]`).forEach(c => c.classList.toggle("on", c.dataset.val === el.value));
  if (el.tagName === "SELECT"){ render(); return; }
  refreshLive();
});
document.addEventListener("change", (e) => { if (MODE === "mission" && e.target.id === "eng"){ S.engagement = e.target.checked; save(); refreshLive(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#modal").hidden = true;
  if (e.key === "Enter" && e.target.id === "em"){ const b = $('[data-act="login"]'); if (b && !b.disabled) b.click(); }
  if (MODE_TEST && e.ctrlKey && e.altKey && e.key.toLowerCase() === "d"){     // réservé au mode ?test : le paquet contient des réponses
    const m = $("#modal"); m.innerHTML = `<div class="box" role="dialog"><h3>Données de la mission (format envoyé à la base)</h3><pre>${esc(JSON.stringify(S.lastPayload || payload("apercu"), null, 2))}</pre><button class="btn btn-main" data-act="close">Fermer</button></div>`; m.hidden = false; }
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "login"){ const em = LOGIN.email.trim().toLowerCase(); if (emailOk(em)) seConnecter(em); return; }
  if (b.dataset.act === "retry"){ seConnecter(S.eleve.email || SESSION.email); return; }
  if (b.dataset.act === "logout"){ save(); MODE = "login"; LOGIN = {email:"", busy:false, err:"", lent:false}; S = fresh(); render(true); return; }
  if (b.dataset.act === "close"){ $("#modal").hidden = true; return; }
  if (b.dataset.act === "brief"){ S.briefing = true; MODE = "mission"; save(); render(true); return; }
  if (b.dataset.act === "print"){ $("#print-area").innerHTML = dossierImpression(); window.print(); return; }
  if (b.dataset.act === "resend"){ S.envoi = {mode:"wait"}; render(); envoyer("termine").then(confirmerEnvoi); return; }
  if (MODE !== "mission") return;

  if (b.dataset.pick === "type"){
    if (complet(b.dataset.id) && S.typeId !== b.dataset.id){ toast("<div>Cette activité est complète. Choisis-en une autre !</div>"); return; }
    if (S.typeId !== b.dataset.id){ S.typeId = b.dataset.id; S.symbole = null; S.clientele = null; }
    save(); render(); return;
  }
  if (b.dataset.raison){
    const r = b.dataset.raison, i = S.raisons.indexOf(r);
    if (i >= 0) S.raisons.splice(i,1); else if (S.raisons.length < 2) S.raisons.push(r); else { toast("<div>Deux raisons maximum : retire d'abord une raison.</div>"); return; }
    save(); render(); return;
  }
  if (b.dataset.quiz){
    const k = b.dataset.quiz; if (S.quiz[k]) return;
    const ok = +b.dataset.i === QUIZ[k].ok;
    S.quiz[k] = { rep:+b.dataset.i, ok };
    if (ok){ S.xp += 50; toast("<b>+50 XP</b><div>⚡ Défi éclair réussi</div>"); } else toast("<div>Raté, mais tu viens d'apprendre quelque chose : lis l'explication.</div>");
    save(); render(); return;
  }
  if (b.dataset.set){
    const k = b.dataset.set, num = ["nbAssocies","apport","emprunt"].includes(k);
    S[k] = num ? +b.dataset.val : b.dataset.val;
    if (k === "direction" && S.direction === "seul") S.nbAssocies = 1;
    if (k === "apport" || k === "direction" || k === "nbAssocies") { /* la décision de la banque est recalculée */ }
    save(); render(); return;
  }
  switch (b.dataset.act){
    case "next": suivant(); break;
    case "back": if (S.step > 1){ S.step--; save(); render(true); } break;
    case "rndnum": S.numero = String(1 + Math.floor(Math.random()*180)); save(); render(); break;
    case "send": envoyerFinal(); break;
    case "bonus": {
      if (S.bonus.concurrent.trim().split(/\s+/).length < 2 || S.bonus.concurrent.trim().length < 5){ toast("<div>Écris le nom du commerce trouvé et sa commune (deux mots au moins).</div>"); return; }
      S.bonusDone.adresse = true; S.xp += 50; toast(`<b>+50 XP</b><div>${BONUS_BADGES.adresse[0]} Badge débloqué : ${BONUS_BADGES.adresse[1]}</div>`); save(); render(); break; }
  }
});

<script id="kit-realiste-js">

const KIT = (() => {

  const SON = (() => {
    let ctx = null, master = null, actif = true;

      if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
      if (ctx.state === "suspended") ctx.resume().catch(() => {});

    };
    function note(freq, debut, duree, type, vol, glisse){
      const c = ac(); if (!c) return;
      const t = c.currentTime + debut, o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t); if (glisse) o.frequency.exponentialRampToValueAtTime(glisse, t + duree);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .12, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + duree);

      s.buffer = buf; f.type = filtre; f.frequency.setValueAtTime(freq, t); if (freqFin) f.frequency.exponentialRampToValueAtTime(freqFin, t + duree);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .15, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + duree);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + duree + .02);
    }
    const SONS = {
      clic:    () => note(1500, 0, .035, "sine", .05),
      succes:  () => { note(1047, 0, .13, "triangle", .11); note(1319, .1, .2, "triangle", .11); },
      xp:      () => [1047, 1319, 1568, 2093].forEach((f, i) => note(f, i * .055, .11, "triangle", .07)),

    return {

  // ─── Décor : silhouette de la ville le soir, fenêtres allumées ───

  // ─── Les animations d'arrivée ne se rejouent pas quand l'écran est redessiné (clic sur une option…) ───

  }

  // ─── Code-barres et QR code (décoratifs, générés à partir d'un texte) ───
  function codeBarres(texte, h){
    h = h || 40; const r = rnd(hashK(texte)); let x = 0, barres = "";
    barres += `<rect x="0" y="0" width="2" height="${h}"/><rect x="3" y="0" width="1" height="${h}"/>`; x = 6;
    while (x < 150){ const w = 1 + Math.floor(r() * 3); if (r() < .55) barres += `<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x += w + (r() < .5 ? 1 : 2); }

    return `<svg viewBox="0 0 ${x + 6} ${h}" preserveAspectRatio="none" fill="#111" aria-hidden="true">${barres}</svg>`;
  }
  function qr(texte){
    const n = 25, r = rnd(hashK("qr" + texte)), m = [];
    for (let y = 0; y < n; y++){ m.push([]); for (let x = 0; x < n; x++) m[y].push(r() < .48); }
    const repere = (ox, oy) => { for (let y = -1; y < 8; y++) for (let x = -1; x < 8; x++){ const yy = oy + y, xx = ox + x; if (yy < 0 || xx < 0 || yy >= n || xx >= n) continue;
      const bord = x === 0 || x === 6 || y === 0 || y === 6, coeur = x >= 2 && x <= 4 && y >= 2 && y <= 4; m[yy][xx] = (x >= 0 && x <= 6 && y >= 0 && y <= 6) && (bord || coeur); } };
    repere(0, 0); repere(n - 7, 0); repere(0, n - 7);
    for (let i = 8; i < n - 8; i++){ m[6][i] = i % 2 === 0; m[i][6] = i % 2 === 0; }
    let d = ""; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) d += `M${x} ${y}h1v1h-1z`;

  /** Fait « appuyer » les touches d'un terminal (.terminal .keys span), une par une. */
  async function taperTouches(terminal, touches, pause){
    if (!terminal) return; const spans = [...terminal.querySelectorAll(".keys span")];

  function cascade(racine, cle){

        sol += `<polygon points="${vx - 4},210 ${vx + vw + 34},210 ${vx + vw + 52},226 ${vx - 22},226" fill="url(#m1r-flaque)"/>`;

    return `<svg viewBox="0 0 960 242" aria-hidden="true"><defs>
      <linearGradient id="m1r-chaud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c4"/><stop offset="1" stop-color="#f3a654"/></linearGradient>
      <linearGradient id="m1r-flaque" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd58a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></linearGradient>
      <linearGradient id="m1r-tamise" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf86" stop-opacity=".34"/><stop offset="1" stop-color="#ffcf86" stop-opacity=".08"/></linearGradient>
      <radialGradient id="m1r-halo"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".75"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient></defs>
      ${etoiles}<circle cx="916" cy="30" r="11" fill="#f4edd0"/><circle cx="921" cy="26" r="10" fill="#141640"/>
      ${s}<rect x="0" y="210" width="960" height="14" fill="#4a4561"/><rect x="0" y="210" width="960" height="2" fill="#000" opacity=".3"/><rect x="0" y="224" width="960" height="4" fill="#8f8aa6"/>
      <rect x="0" y="228" width="960" height="14" fill="#24213a"/><path d="M0 236h960" stroke="#fff" stroke-opacity=".35" stroke-dasharray="16 14"/>${sol}${reverbere(242)}${reverbere(478)}${reverbere(714)}</svg>`;

  // ─── 6. Identité : le dossier de marque sur le bureau (carte de visite, sac, nuancier), à jour à chaque frappe ───
  function dossierMarque(){
    const nom = S.nom.trim() || "Ton entreprise", slogan = S.slogan.trim() || "Ton slogan", police = "f-" + (S.style || "moderne");
    const c1 = COULEURS.find(c => c[1] === S.couleur), c2 = COULEURS2.find(c => c[1] === S.couleur2), vide = "repeating-linear-gradient(45deg,#e4e4e4 0 6px,#fff 6px 12px)";
    const pastille = (val, nomC, defaut) => `<span class="m1-mq-pastille"><i style="background:${X(val || vide)}"></i>${X(nomC ? nomC[0] : defaut)}</span>`;
    return `<div class="m1-marque" aria-hidden="true">
      <div class="m1-mq-carte"><span class="m1-mq-bande" style="background:${X(S.couleur || "#8E4EC6")}"></span>${logoMark(48)}
        <span class="m1-mq-txt"><b class="${police}" style="color:${X(nomSurBlanc())}">${X(nom)}</b><i>${X(slogan)}</i><span>${X(`${S.eleve.prenom} ${S.eleve.nom}`.trim())}</span>${S.nom.trim() ? `<span>${X(emailPro())}</span>` : ""}</span></div>
      <div class="m1-mq-sac cpt-cache-mobile"><span class="m1-mq-anse"></span>${logoMark(40)}<b class="${police}" style="color:${X(nomSurBlanc())}">${X(nom)}</b></div>
      <div class="m1-mq-nuancier cpt-cache-mobile">${pastille(S.couleur, c1, "Couleur 1")}${pastille(S.couleur2, c2, "Couleur 2")}</div></div>`;
  }
  function eIdentite(main){
    const lp = un(".logo-prev", main); if (lp) poser(lp, "afterend", "m1-marque", dossierMarque());
  }

  // ─── 7. Boutique : la maquette de la façade, l'enseigne qui s'allume la première fois ───
  function eBoutique(main){
    const fw = un(".boutique-grid .front-wrap", main); if (!fw) return;
    marquer(fw, "m1-maquette");

  // ─── 8. Local : annonces épinglées sur le liège, résumé du bail en contrat, plaque de rue ───
  function eLocal(main){
    const grille = tous(".grid.g3", main).find(g => un('[data-set="emplacement"]', g));

      COMPTA.inserer(bail, "beforeend", "m1-bail-pied", `<div class="m1-bail-pied" aria-hidden="true"><span>Le propriétaire${griffe(GRIFFES[0])}</span><span>Le locataire${griffe(GRIFFES[1])}</span>${COMPTA.mention()}</div>`);

  // ─── 9. Forme juridique : le formulaire du guichet d'entreprises, le projet d'acte du notaire et son sceau ───

  // ─── 10. Financement : l'agence Borinage Banque, sa lettre de décision et son tampon, TerrilCalc, le plan financier ───
  function eFinancement(main){
    const cartes = tous(".card", main), credit = cartes.find(c => un('[data-set="emprunt"]', c)), apport = cartes.find(c => un('[data-set="apport"]', c));
    if (apport){

    }
    if (credit){
      marquer(credit, "m1-guichet");
      COMPTA.inserer(credit, "afterbegin", "m1-guichet-logo", `<span class="m1-guichet-logo" aria-hidden="true">${COMPTA.logoBanque({ clair:true })}<small>Agence de Frameries</small></span>`);
      const lettre = un(".bank", credit);
      if (lettre){
        marquer(lettre, "m1-encre", "m1-lettre");
        COMPTA.inserer(lettre, "afterbegin", "m1-lettre-tete", `<div class="m1-lettre-tete" aria-hidden="true">${COMPTA.entete({ logo:"banque", titre:"Décision de crédit", sous:"Service des crédits aux entreprises" })}</div>`);
        COMPTA.inserer(lettre, "beforeend", "m1-lettre-pied", `<div class="m1-lettre-pied" aria-hidden="true"><span>Votre conseiller crédit${griffe(GRIFFES[1])}</span>${COMPTA.mention()}</div>`);
        const dec = un(".dec", lettre);
        if (dec && COMPTA.premiereFois("m1-decision-" + [S.direction, S.nbAssocies, S.apport, S.emprunt].join("-"))){ marquer(dec, "m1-frappe"); COMPTA.son("tampon"); }
        if (emprunt() > 0){
          const m = euro(mensualite()).replace(/\s*€$/, "");
          const calc = poser(credit, "beforeend", "m1-calc", `<div class="m1-calc cpt-cache-mobile" aria-hidden="true">${COMPTA.calculatrice({ ecran:m,

          marquer(credit, "m1-avec-calc");

    const plan = cartes.find(c => un("table.led", c) && !un("[data-set]", c));

      COMPTA.inserer(plan, "beforeend", "m1-plan-pied", `<div class="m1-doc-pied" aria-hidden="true">${COMPTA.mention()}</div>`);
    }
  }

  // ─── 11. Officiel : les documents officiels ───

  // ─── 13. Fin : la boutique allumée, l'enseigne « OUVERT » au néon, les fanions (confettis et fanfare : page d'origine + accroche) ───
  function fanions(){
    const cols = [S.couleur || "#ff3d8b", "#fbbf24", "#22d3ee", "#ff3d8b", "#34d399", "#9d4edd", "#f6f1e6"], n = 15, h = (x) => 3 + Math.sin(Math.PI * x / 400) * 12;
    let d = "";
    for (let i = 0; i < n; i++){
      const a = 4 + i * 392 / n, b = a + 392 / n - 4, m = (a + b) / 2;
      d += `<path d="M${a.toFixed(1)} ${h(a).toFixed(1)}L${b.toFixed(1)} ${h(b).toFixed(1)}L${m.toFixed(1)} ${(h(m) + 16).toFixed(1)}z" fill="${X(cols[i % cols.length])}"/>`;
    }
    return `<svg viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 3Q200 27 400 3" fill="none" stroke="#f3efe1" stroke-width="1.2"/>${d}</svg>`;
  }
  const PANCARTE = `<svg viewBox="0 0 210 150" aria-hidden="true"><path d="M105 9 38 54M105 9l67 45" stroke="#8b6a3e" stroke-width="2.4" fill="none"/>
    <circle cx="105" cy="8" r="6" fill="#e3b85c" stroke="#8a6514" stroke-width="2"/><rect x="14" y="46" width="182" height="96" rx="12" fill="#fffdf6"/>
    <rect x="21" y="53" width="168" height="82" rx="8" fill="none" stroke="#c62828" stroke-width="5"/><circle cx="38" cy="58" r="3.5" fill="#9aa1b1"/><circle cx="172" cy="58" r="3.5" fill="#9aa1b1"/>
    <text x="105" y="102" text-anchor="middle" font-size="35" textLength="136" lengthAdjust="spacingAndGlyphs" fill="#c62828" style="font-family:Outfit,Inter,Arial,sans-serif;font-weight:800">OUVERT</text>
    <text x="105" y="127" text-anchor="middle" font-size="19" fill="#1f2433" style="font-family:Caveat,'Segoe Print',cursive;font-weight:700">Bienvenue !</text></svg>`;
  function eFin(main){
    const hero = un(".hero", main);
    if (hero) COMPTA.inserer(hero, "afterbegin", "m1-pancarte", `<div class="m1-pancarte m1-balance-pancarte" data-anim="m1-pancarte" aria-hidden="true">${PANCARTE}</div>`);

  function eFerme(main){

  // ─── V4 : petits films (3 s au plus, comme aux 3P et dans les missions 2 et 3), au passage d'un écran à l'autre ───
  const DRAPEAU = `<svg viewBox="0 0 30 36" aria-hidden="true"><rect width="10" height="36" fill="#1f2433"/><rect x="10" width="10" height="36" fill="#f6c700"/><rect x="20" width="10" height="36" fill="#d62828"/></svg>`;
  /** Le courrier officiel arrive : la lettre de la Banque-Carrefour des Entreprises sort de l'enveloppe, avec le numéro qui vient d'être attribué. */
  function filmOfficiel(){
    const ids = S.ids; if (!ids) return null;
    return { duree:2600, texte:"Le courrier officiel est arrivé : ton entreprise est enregistrée !",
      html:`<div class="m1-sc m1-sc-courrier"><div class="m1-env"><span class="m1-env-rabat"></span>
        <div class="m1-env-lettre"><b>Banque-Carrefour des Entreprises</b><small>Numéro d'entreprise attribué à ${X(deno())}</small><span class="m1-env-num">${X(ids.bce)}</span><small>Numéro de TVA : BE ${X(ids.bce)}</small><span class="m1-env-tampon">Enregistrée</span></div>
        <span class="m1-env-corps"><span class="m1-env-timbre">${DRAPEAU}</span><span class="m1-env-adresse"><b>${X(deno())}</b>${X(adresse1())}<br>${X(adresse2())}</span></span></div></div>`,
      jouer(el, ms){ const sc = el.querySelector(".m1-sc-courrier"); COMPTA.etapes(el, ms, [[.04, () => { sc.classList.add("arrive"); COMPTA.son("papier"); }], [.3, () => sc.classList.add("ouvre")], [.46, () => { sc.classList.add("sort"); COMPTA.son("papier"); }], [.74, () => { sc.classList.add("tampon"); COMPTA.son("tampon"); }]]); },
      final(el){ el.querySelector(".m1-sc-courrier").classList.add("arrive", "ouvre", "sort", "tampon"); } };
  }
  const NOEUD = `<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M50 35C30 8 2 12 8 33c4 15 28 12 42 2z" fill="#e02424"/><path d="M50 35C70 8 98 12 92 33c-4 15-28 12-42 2z" fill="#e02424"/>
    <path d="M14 26c8-7 22-5 30 6M86 26c-8-7-22-5-30 6" stroke="#ff9a9a" stroke-width="2.4" fill="none" opacity=".7"/><path d="M45 38L33 68l9-4 6 6 4-30zM55 38l12 30-9-4-6 6-4-30z" fill="#c21b1b"/><circle cx="50" cy="35" r="8" fill="#b01818"/></svg>`;
  const CISEAUX = `<svg viewBox="0 0 120 60" aria-hidden="true">
    <g><path d="M52 30L117 23q2 1.5 0 3L54 33z" fill="#eef1f5" stroke="#7d8696"/><ellipse cx="22" cy="16" rx="15" ry="9" fill="none" stroke="#e5484d" stroke-width="6"/><path d="M35 21L52 30" stroke="#e5484d" stroke-width="6" stroke-linecap="round"/></g>
    <g><path d="M52 30L117 37q2-1.5 0-3L54 27z" fill="#d9dee5" stroke="#7d8696"/><ellipse cx="22" cy="44" rx="15" ry="9" fill="none" stroke="#e5484d" stroke-width="6"/><path d="M35 39L52 30" stroke="#e5484d" stroke-width="6" stroke-linecap="round"/></g>
    <circle cx="52" cy="30" r="3.4" fill="#5b6474"/></svg>`;
  /** L'inauguration : les ciseaux coupent le ruban devant la vitrine, la boutique s'allume (la page de fin est derrière). */
  function filmRuban(){
    return { duree:3000, texte:`${deno()} ouvre ses portes !`,
      html:`<div class="m1-sc m1-sc-ruban"><div class="m1-cer-vitrine">${COMPTA.vitrineEQ("m1cer-off", { allumee:false, panneau:"FERMÉ" })}<div class="m1-cer-on">${COMPTA.vitrineEQ("m1cer-on")}</div>
        <div class="m1-cer-ruban"><span class="g"></span><span class="d"></span></div><div class="m1-cer-noeud">${NOEUD}</div><div class="m1-cer-ciseaux">${CISEAUX}</div></div></div>`,
      jouer(el, ms){ const sc = el.querySelector(".m1-sc-ruban"); COMPTA.etapes(el, ms, [[.04, () => sc.classList.add("ciseaux")], [.3, () => { sc.classList.add("coupe"); COMPTA.son("papier"); }], [.46, () => sc.classList.add("allume")]]); },
      final(el){ el.querySelector(".m1-sc-ruban").classList.add("ciseaux", "coupe", "allume"); } };
  }
  let precedent = null;
  function films(e){
    if (precedent === e) return;
    const avant = precedent; precedent = e;
    if (!avant || MODE !== "mission") return;
    const f = avant === "financement" && e === "officiel" ? filmOfficiel() : avant === "lancement" && e === "fin" ? filmRuban() : null;
    if (f) COMPTA.film(Object.assign({ cle:"m1-" + e }, f));
  }

  const ECRANS = { login:eLogin, briefing:eBriefing, type:eActivite, clientele:eClientele, strategie:eStrategie, identite:eIdentite, boutique:eBoutique,
    local:eLocal, forme:eForme, financement:eFinancement, officiel:eOfficiel, lancement:eLancement, fin:eFin, ferme:eFerme };
  let ecranVu = null;
  function decorer(){
    try {
      const main = document.getElementById("main"); if (!main) return;
      COMPTA.coachs(document);                                        // Nadia dessinée à la place de l'émoji
      const cle = ecran();
      if (document.body.getAttribute("data-m1") !== cle) document.body.setAttribute("data-m1", cle);
      // V4 : les apparitions (.reveal) ne se rejouent plus quand l'écran se redessine (réponse à un défi, choix d'une option)
      document.body.classList.toggle("m1-revu", cle === ecranVu); ecranVu = cle;
      if (ECRANS[cle]) ECRANS[cle](main);
      COMPTA.cascade(main, cle);                                      // V4 : les blocs de l'écran arrivent l'un après l'autre (une fois)
      COMPTA.xpSaute(S.xp || 0);
      films(cle);
    } catch(e) { console.warn("décor :", e); }
  }
  // ─── Accroche (seules affectations permises : render, refreshLive, vitrine, toast, confetti) ───
  const renduOrigine = render, rafraichiOrigine = refreshLive, toastOrigine = toast, confettiOrigine = confetti;
  render = function(scroll){ renduOrigine(scroll); decorer(); };
  refreshLive = function(){ rafraichiOrigine(); decorer(); };
  vitrine = COMPTA.vitrineEQ;                                         // façade réaliste : mêmes choix, mêmes valeurs par défaut
  toast = function(html, cls){ toastOrigine(html, cls); COMPTA.son(cls === "word" ? "notif" : /^<b>\+\d+ XP/.test(String(html)) ? "xp" : "notif"); };
  confetti = function(){ confettiOrigine(); COMPTA.son("fanfare"); };
  window.__decor = { renduOrigine, decorer, ecran };
  COMPTA.creditsImages();                                             // crédits des photos de matières (CC0), au bas de la page
  COMPTA.vivant();                                                    // V4 : cartes qui réagissent, reflets, notifications façon téléphone (comme les missions 2 et 3)
  if (document.querySelector("#main svg.front, #side svg.front")) render(); else decorer();
  return { decorer, ecran };
})();
// ═══ DÉCOR MISSION 1 — fin ═══
</script>
</body>
</html>
